name: release

# Pushing a tag vX.Y.Z builds the source archive and wheels, then publishes them as the
# GitHub Release for that tag, and to PyPI if that has been switched on (see RELEASING.md).
# Running it by hand (Actions > release > Run workflow) builds the same files without
# publishing anything, as a dry run.
#
# Wheels: Linux x86_64 carries the CUDA backend (and uses the CPU on a machine with no GPU);
# macOS, Windows and Linux aarch64 are CPU-only.
#
# See RELEASING.md for the steps around it.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Refuses to release unless the tag, CMakeLists.txt and CHANGELOG.md agree.
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          version=$(sed -nE 's/^project\(neraulgraphics VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then
            echo "::error::no version found in CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in CMakeLists.txt"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "version $version"

  sdist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # Settings live in [tool.cibuildwheel] in pyproject.toml, shared with local builds.
  # Linux x86_64, with the CUDA backend.
  wheels:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-cuda
          path: wheelhouse/*.whl

  # Everything without CUDA: the build finds no CUDA compiler and builds the CPU backend only.
  wheels-cpu:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-amd64, os: windows-latest }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, archs: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.archs }}
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: wheelhouse/*.whl

  publish:
    if: github.ref_type == 'tag'
    needs: [check-version, sdist, wheels, wheels-cpu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          # The release notes are this version's section of CHANGELOG.md.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "neraulgraphics $VERSION" \
            --notes-file notes.md

  # PyPI, by trusted publishing: no token is stored here. It does nothing until the repository
  # variable PUBLISH_TO_PYPI is set to true, after the one-time setup on pypi.org in RELEASING.md.
  pypi:
    if: github.ref_type == 'tag' && vars.PUBLISH_TO_PYPI == 'true'
    needs: [check-version, sdist, wheels, wheels-cpu, publish]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
